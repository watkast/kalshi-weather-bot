name: paper-trade

on:
  schedule:
    - cron: "17 */3 * * *"   # every 3 hours
  workflow_dispatch:          # lets you run it by hand from the Actions tab

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - name: Run paper bot
        run: python bot.py | tee run.log
      - name: Show results on the run page
        run: tail -n 1 run.log >> "$GITHUB_STEP_SUMMARY"
      - name: Save trade log
        run: |
          git config user.name "paper-bot"
          git config user.email "paper-bot@users.noreply.github.com"
          git add trades.csv
          git diff --cached --quiet || git commit -m "Paper trades update"
          git push
