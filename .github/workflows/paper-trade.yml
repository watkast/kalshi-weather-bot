name: paper-trade

on:
  schedule:
    - cron: "17 */3 * * *"   # every 3 hours
  workflow_dispatch:          # lets you run it by hand from the Actions tab
  push:                       # also runs whenever the bots' code changes
    branches: [main]
    paths: ["*.py", ".github/workflows/**"]

permissions:
  contents: write

concurrency:
  group: paper-trade
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - name: Temperature bot
        timeout-minutes: 12
        run: python bot.py | tee temp.log
        continue-on-error: true
      - name: Rain bot
        timeout-minutes: 12
        run: python rain_bot.py | tee rain.log
        continue-on-error: true
      - name: Longshot fade bot
        timeout-minutes: 12
        run: python longshot_bot.py | tee longshot.log
        continue-on-error: true
      - name: Show results on the run page
        run: |
          echo "Temperature — $(tail -n 1 temp.log)" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          tail -n 1 rain.log >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          tail -n 1 longshot.log >> "$GITHUB_STEP_SUMMARY"
      - name: Save trade logs
        run: |
          git config user.name "paper-bot"
          git config user.email "paper-bot@users.noreply.github.com"
          git add *.csv
          git diff --cached --quiet || git commit -m "Paper trades update"
          git pull --rebase -q
          git push
