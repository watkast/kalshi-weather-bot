name: one-cent-study

on:
  schedule:
    - cron: "41 */2 * * *"   # keeps a run queued so watch windows follow back-to-back
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["study_bot.py", ".github/workflows/study.yml"]

permissions:
  contents: write

concurrency:
  group: one-cent-study
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 358
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests matplotlib
      - name: Set up git
        run: |
          git config user.name "paper-bot"
          git config user.email "paper-bot@users.noreply.github.com"
          # A queued run checks out the code from when it was queued; start from the latest data instead.
          git fetch -q --depth=1 origin main && git reset -q --hard FETCH_HEAD
      - name: Watch every sport for 1¢ moments
        env:
          RUN_MINUTES: "348"
          PYTHONUNBUFFERED: "1"
        run: python study_bot.py | tee study.log
      - name: Save data
        if: always()
        run: |
          git add study 2>/dev/null || true
          git diff --cached --quiet || git commit -q -m "1-cent study update"
          for i in 1 2 3; do git pull -q --rebase -X theirs && git push -q && break; git rebase --abort 2>/dev/null; sleep 5; done
