name: dashboard

on:
  schedule:
    - cron: "7 * * * *"   # main page; each study bot refreshes its own page
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: dashboard
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install matplotlib
      - name: Rebuild dashboard
        run: |
          git config user.name "paper-bot"
          git config user.email "paper-bot@users.noreply.github.com"
          for attempt in 1 2 3; do
            git pull -q --rebase
            python dashboard.py
            git add README.md
            git diff --cached --quiet && exit 0
            git commit -q -m "Dashboard update"
            git push -q && exit 0
            git reset -q --hard origin/main
            sleep 5
          done
