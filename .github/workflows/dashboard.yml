name: dashboard

on:
  schedule:
    - cron: "*/15 * * * *"   # about every 15 minutes
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: dashboard
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install matplotlib
      - name: Rebuild dashboard
        run: |
          git config user.name "paper-bot"
          git config user.email "paper-bot@users.noreply.github.com"
          for attempt in 1 2 3; do
            git pull -q --rebase
            python dashboard.py
            python study_dashboard.py
            python fifteen_dashboard.py
            git add README.md STUDY.md FIFTEEN.md
            [ -d fifteen/charts ] && git add fifteen/charts
            [ -d study/charts ] && git add study/charts
            git diff --cached --quiet && exit 0
            git commit -q -m "Dashboard update"
            git push -q && exit 0
            git reset -q --hard origin/main
            sleep 5
          done
