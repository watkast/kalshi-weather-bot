name: discover-hourly
on:
  push:
    branches: [main]
    paths: ["tools/discover_hourly.py"]
permissions:
  contents: write
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - run: python tools/discover_hourly.py
      - run: |
          git config user.name "paper-bot"
          git config user.email "paper-bot@users.noreply.github.com"
          git add discovery_hourly.txt
          git commit -q -m "Hourly discovery scan"
          for i in 1 2 3; do git pull -q --rebase -X theirs && git push -q && break; sleep 5; done
