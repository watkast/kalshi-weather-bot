name: discover
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["tools/discover.py"]
permissions:
  contents: write
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - run: python tools/discover.py
      - run: |
          git config user.name "paper-bot"
          git config user.email "paper-bot@users.noreply.github.com"
          git add discovery.txt
          git commit -q -m "Discovery scan"
          git pull -q --rebase
          git push -q
