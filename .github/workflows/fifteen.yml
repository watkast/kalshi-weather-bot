name: fifteen-min-study

on:
  schedule:
    - cron: "11 */2 * * *"   # keeps a run queued so watch windows follow back-to-back
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["fifteen_bot.py", ".github/workflows/fifteen.yml"]

permissions:
  contents: write

concurrency:
  group: fifteen-min-study
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 358
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - name: Set up git
        run: |
          git config user.name "paper-bot"
          git config user.email "paper-bot@users.noreply.github.com"
      - name: Watch every 15-minute market
        env:
          RUN_MINUTES: "330"
          PYTHONUNBUFFERED: "1"
        run: python fifteen_bot.py | tee fifteen.log
      - name: Save data
        if: always()
        run: |
          git add fifteen 2>/dev/null || true
          git diff --cached --quiet || git commit -q -m "15-min study update"
          for i in 1 2 3; do git pull -q --rebase && git push -q && break; sleep 5; done
