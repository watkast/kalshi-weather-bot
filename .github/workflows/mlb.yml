name: mlb-1-cent

on:
  schedule:
    - cron: "3 */6 * * *"   # back-to-back ~6-hour watch windows
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["mlb_bot.py", ".github/workflows/mlb.yml"]

permissions:
  contents: write

concurrency:
  group: mlb-1-cent
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 358
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - name: Set up git
        run: |
          git config user.name "paper-bot"
          git config user.email "paper-bot@users.noreply.github.com"
      - name: Watch MLB games
        env:
          RUN_MINUTES: "340"
          PYTHONUNBUFFERED: "1"
        run: python mlb_bot.py | tee mlb.log
      - name: Show results on the run page
        if: always()
        run: tail -n 1 mlb.log >> "$GITHUB_STEP_SUMMARY" || true
      - name: Save logs
        if: always()
        run: |
          git add mlb_trades.csv mlb_price_log.csv 2>/dev/null || true
          git diff --cached --quiet || git commit -m "MLB 1-cent bot update"
          git pull --rebase -q
          git push
